      <stop offset="0%" stop-color="#2f244c" />
      <stop offset="100%" stop-color="#1e1730" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f76" />
      <stop offset="100%" stop-color="#ff85a1" />
    </linearGradient>
