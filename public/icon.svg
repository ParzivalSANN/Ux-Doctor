  <circle cx="64" cy="100" r="10" fill="#7ee7c7" stroke="#15382b" stroke-width="3" />

  <!-- Canlılık Noktası -->
  <circle cx="98" cy="30" r="5" fill="#fed668" />
  <circle cx="30" cy="30" r="5" fill="#fed668" />
